name: diptych
description: "Diptych - 双人私密日记"
publish_to: 'none'
version: 1.3.2+45

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^3.4.2
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  table_calendar: ^3.3.0
  intl: ^0.20.3
  flutter_cache_manager: ^3.4.2
  file: ^7.0.1
  cached_network_image: ^4.0.4
  path_provider: ^2.1.0
  package_info_plus: ^10.0.0
  open_filex: ^5.0.0
  image_cropper: ^13.0.0
  photo_view: ^0.15.0
  video_player: ^2.14.0
  wechat_assets_picker: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/not_posted_self.png
