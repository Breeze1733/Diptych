name: diptych
description: "Diptych - 双人私密日记"
publish_to: 'none'
version: 1.1.6+23

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP 请求
  http: ^1.2.0
  # 状态管理
  flutter_riverpod: ^3.4.2
  # 图片选择
  image_picker: ^1.1.2
  # 本地存储
  shared_preferences: ^2.3.5
  # 日历
  table_calendar: ^3.2.1
  # 日期格式化
  intl: ^0.20.3
  # 缓存管理
  flutter_cache_manager: ^3.4.2
  # 图片缓存
  cached_network_image: ^3.4.1
  # 文件路径
  path_provider: ^2.1.0
  # 获取应用版本号
  package_info_plus: ^10.0.0
  # 打开文件（触发安装）
  open_filex: ^4.4.0
  image_cropper: ^12.2.1
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/not_posted_self.png
    - assets/not_posted_partner.png
