name: diptych
description: "Diptych - 双人私密日记"
publish_to: 'none'
version: 1.1.17+34

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # HTTP 请求
  http: ^1.2.0
  # 状态管理
  flutter_riverpod: ^3.4.2
  # 图片选择
  image_picker: ^1.1.2
  # 本地存储
  shared_preferences: ^2.3.5
  # 日历
  table_calendar: ^3.3.0
  # 日期格式化
  intl: ^0.20.2
  # 缓存管理
  flutter_cache_manager: ^3.4.2
  # 图片缓存
  cached_network_image: ^4.0.0
  # 文件路径
  path_provider: ^2.1.0
  # 获取应用版本号
  package_info_plus: ^10.0.0
  # 打开文件
  open_filex: ^4.4.0
  image_cropper: ^12.2.1
  photo_view: ^0.15.0
  video_player: ^2.14.0
  wechat_assets_picker: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/not_posted_self.png
    - assets/not_posted_partner.png

dependency_overrides:
  intl: 0.20.3
  cupertino_ui: 1.1.1
  material_ui: 1.5.0
  clock: 1.1.3
  code_assets: 2.1.0
  hooks: 2.2.0
  matcher: 0.12.20
  material_color_utilities: 0.13.1
  meta: 1.19.0
  objective_c: 9.6.2
  record_use: 1.1.1
  stack_trace: 1.12.2
  test_api: 0.7.14
  vector_math: 2.4.3

