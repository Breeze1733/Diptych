# Include inside the breeze.qzz.io server block.
# Keep the existing clipboard URL while serving it from transfer-backend.
location = /api/clips {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:3001/clips;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/clips/ {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:3001/clips/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Both applications live under the document root; expose their HTTP routes only.
location = /backend { return 404; }
location ^~ /backend/ { return 404; }
location = /transfer-backend { return 404; }
location ^~ /transfer-backend/ { return 404; }
